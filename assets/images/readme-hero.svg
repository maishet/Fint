<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">My Fint</title>
  <desc id="d">Marca D «Boleta + Mosaico»: losa amarilla con el isotipo de tres monedas, una boleta de patrimonio y un aviso de vencimiento.</desc>
  <defs>
    <clipPath id="slab">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
    <filter id="shadowPaper" x="600" y="40" width="560" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#141412" flood-opacity="0.28"/>
    </filter>
    <filter id="shadowInk" x="700" y="230" width="460" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#141412" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#slab)">
    <!-- La losa: el amarillo de la marca, igual en claro y oscuro -->
    <rect width="1200" height="420" fill="#FFC629"/>

    <!-- Isotipo: tres monedas apiladas (canto #6B5A1E, cara tinta) -->
    <g transform="translate(76 78) scale(1.05)">
      <ellipse cx="60" cy="84" rx="34" ry="11" fill="#6B5A1E"/>
      <rect x="26" y="78" width="68" height="6" fill="#6B5A1E"/>
      <ellipse cx="60" cy="78" rx="34" ry="11" fill="#141412"/>
      <ellipse cx="60" cy="68" rx="28" ry="10" fill="#6B5A1E"/>
      <rect x="32" y="62" width="56" height="6" fill="#6B5A1E"/>
      <ellipse cx="60" cy="62" rx="28" ry="10" fill="#141412"/>
      <ellipse cx="60" cy="53" rx="20" ry="9" fill="#6B5A1E"/>
      <rect x="40" y="47" width="40" height="6" fill="#6B5A1E"/>
      <ellipse cx="60" cy="47" rx="20" ry="9" fill="#141412"/>
    </g>

    <text x="76" y="238" fill="#141412" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.5">Tu dinero,</text>
    <text x="76" y="312" fill="#141412" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.5">más claro</text>
    <text x="78" y="360" fill="#5C4A12" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Cuentas, gastos y vencimientos en una sola vista.</text>

    <!-- Boleta del patrimonio (papel, inclinada) -->
    <g transform="rotate(-3 880 150)" filter="url(#shadowPaper)">
      <rect x="650" y="62" width="460" height="196" rx="28" fill="#FFFFFF"/>
      <text x="684" y="110" fill="#55534C" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800">Patrimonio neto</text>
      <rect x="1038" y="88" width="40" height="40" rx="13" fill="#FDEBDD"/>
      <rect x="1046" y="102" width="24" height="17" rx="4" fill="#B5651D"/>
      <path d="M1053 102v-3a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v3" stroke="#8A4A12" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="1046" y="108" width="24" height="2.4" fill="#8A4A12"/>
      <text x="684" y="184" fill="#6B6960" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500">S/</text>
      <text x="722" y="184" fill="#141412" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">18 420<tspan font-size="36" fill="#6B6960">.65</tspan></text>
      <rect x="684" y="208" width="150" height="30" rx="15" fill="#141412"/>
      <text x="759" y="229" text-anchor="middle" fill="#3DD68C" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">+S/ 1 240.00</text>
      <text x="848" y="229" fill="#55534C" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800">este mes</text>
    </g>

    <!-- Aviso de vencimiento (tinta, inclinado) -->
    <g transform="rotate(2 930 300)" filter="url(#shadowInk)">
      <rect x="730" y="262" width="400" height="76" rx="22" fill="#141412"/>
      <rect x="752" y="278" width="44" height="44" rx="14" fill="#FDF6DC"/>
      <circle cx="774" cy="297" r="9" fill="#F5B800"/>
      <rect x="769" y="306" width="10" height="7" rx="2" fill="#B58500"/>
      <text x="812" y="308" fill="#FFFFFF" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Luz del Sur vence mañana</text>
    </g>
  </g>
</svg>
